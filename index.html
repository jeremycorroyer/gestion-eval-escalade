<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Évaluation Escalade EPS</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            
            --tp-bg: #475569;
            --tp-text: #ffffff;
            --bleu-bg: #2563eb;
            --bleu-text: #ffffff;
            --vert-bg: #16a34a;
            --vert-text: #ffffff;
            --rouge-bg: #dc2626;
            --rouge-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 30px;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .mode-toggle {
            display: flex;
            background: var(--bg);
            border-radius: 8px;
            padding: 2px;
            border: 1px solid var(--border);
        }

        .mode-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .mode-btn.active {
            background: var(--accent);
            color: #0f172a;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            margin-bottom: 10px;
        }

        select:focus, input:focus, textarea:focus {
            border-color: var(--accent);
        }

        .climb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .way-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .way-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .buttons-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .climb-btn {
            border: none;
            padding: 14px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            position: relative;
            transition: transform 0.1s, opacity 0.2s;
        }

        .climb-btn:active {
            transform: scale(0.96);
        }

        .climb-btn.tp { background-color: var(--tp-bg); color: var(--tp-text); }
        .climb-btn.bleu { background-color: var(--bleu-bg); color: var(--bleu-text); }
        .climb-btn.vert { background-color: var(--vert-bg); color: var(--vert-text); }
        .climb-btn.rouge { background-color: var(--rouge-bg); color: var(--rouge-text); }

        .climb-btn.done {
            opacity: 0.4;
            box-shadow: inset 0 0 0 2px var(--text);
        }

        .climb-btn.done::after {
            content: "✓ VALIDÉE";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.9);
            color: #4ade80;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .pts-tag {
            font-size: 0.75rem;
            opacity: 0.9;
            font-weight: normal;
        }

        .summary-banner {
            background: #1e3a8a;
            border: 1px solid #3b82f6;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prof-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .stats-table-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        th {
            background-color: var(--bg);
            color: var(--text-muted);
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .score-badge {
            background: var(--accent);
            color: #0f172a;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: 700;
        }

        .note-badge {
            background: #22c55e;
            color: #0f172a;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .input-score {
            width: 65px;
            padding: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 0;
        }

        .details-list {
            font-size: 0.75rem;
            color: var(--text-muted);
            max-width: 250px;
        }

        .btn-action {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-secondary {
            background: #475569;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        /* Styles spécifiques au configurateur de barème */
        .bareme-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .quick-color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin: 12px 0 18px 0;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .color-box {
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .color-box.tp { background: rgba(71, 85, 105, 0.4); border: 1px solid var(--tp-bg); }
        .color-box.bleu { background: rgba(37, 99, 235, 0.25); border: 1px solid var(--bleu-bg); }
        .color-box.vert { background: rgba(22, 163, 74, 0.25); border: 1px solid var(--vert-bg); }
        .color-box.rouge { background: rgba(220, 38, 38, 0.25); border: 1px solid var(--rouge-bg); }

        .color-box input {
            margin-bottom: 0;
            padding: 6px;
            text-align: center;
            font-weight: bold;
        }

        .bareme-way-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .bareme-way-row:last-child {
            border-bottom: none;
        }

        .bareme-inputs-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mini-lvl-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .mini-lvl-badge.tp { background: var(--tp-bg); }
        .mini-lvl-badge.bleu { background: var(--bleu-bg); }
        .mini-lvl-badge.vert { background: var(--vert-bg); }
        .mini-lvl-badge.rouge { background: var(--rouge-bg); }

        .mini-lvl-badge input {
            width: 55px;
            padding: 4px;
            margin-bottom: 0;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1 id="app-title">Escalade EPS</h1>
        <div class="mode-toggle">
            <button class="mode-btn active" onclick="setMode('eleve')">Mode Élève</button>
            <button class="mode-btn" onclick="setMode('prof')">Mode Professeur</button>
        </div>
    </header>

    <div class="container">
        
        <!-- SÉLECTEUR DE CLASSE GLOBAL -->
        <div class="card">
            <label for="class-select">Classe active :</label>
            <div style="display: flex; gap: 10px;">
                <select id="class-select" onchange="changeActiveClasse(this.value)" style="margin-bottom:0; flex:1;">
                    <!-- Généré dynamiquement -->
                </select>
                <button class="btn-secondary" onclick="createNewClassPrompt()">+ Nouvelle classe</button>
            </div>
        </div>

        <!-- SECTION ÉLÈVE -->
        <section id="section-eleve">
            <div class="card">
                <label for="student-select">Sélectionne ton nom et prénom :</label>
                <select id="student-select" onchange="loadStudentData()">
                    <option value="">-- Choisis ton nom --</option>
                </select>
            </div>

            <div id="student-workspace" class="hidden">
                <div class="summary-banner">
                    <div>
                        <strong id="display-student-name">Élève</strong>
                        <div style="font-size: 0.85rem; color: #93c5fd;" id="display-climb-count">0 voie(s) validée(s)</div>
                    </div>
                    <div style="text-align: right;">
                        <span id="display-student-pts" class="score-badge">0 pts</span>
                    </div>
                </div>

                <div class="climb-grid" id="climb-grid">
                    <!-- Généré dynamiquement -->
                </div>
            </div>
        </section>

        <!-- SECTION PROFESSEUR -->
        <section id="section-prof" class="hidden">
            
            <!-- PARAMÉTRAGE DU BARÈME DE LA CLASSE -->
            <div class="card">
                <div class="bareme-header" onclick="toggleBaremePanel()">
                    <div>
                        <strong style="color: var(--accent); font-size: 1rem;">⚙️ Barème personnalisé (<span id="bareme-class-label">4e3</span>)</strong>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Assouplir ou durcir les points attendus pour cette classe</div>
                    </div>
                    <button class="btn-secondary" id="toggle-bareme-btn" style="padding: 6px 12px; font-size: 0.8rem;">Afficher / Modifier</button>
                </div>

                <div id="bareme-panel" class="hidden" style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px;">
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <label style="margin:0;">Plafond note totale (/):</label>
                            <input type="number" id="max-total-input" class="input-score" style="width: 70px;" value="40" min="10" max="100" step="1" onchange="updateClassSettings()">
                        </div>
                        <div style="font-size: 0.85rem; color: var(--text-muted);">
                            Total possible sur le mur : <strong id="wall-max-pts" style="color: var(--accent);">33.5</strong> pts
                        </div>
                        <button class="btn-secondary" style="padding: 6px 10px; font-size: 0.8rem;" onclick="resetBaremeToDefault()">Barème standard</button>
                    </div>

                    <label>1. Ajustement rapide par couleur (applique à toutes les voies) :</label>
                    <div class="quick-color-grid">
                        <div class="color-box tp">
                            <span>Toute prise</span>
                            <input type="number" id="bulk-tp" step="0.25" min="0" placeholder="ex: 0.5" onchange="applyBulkLevelPts('tp', this.value)">
                        </div>
                        <div class="color-box bleu">
                            <span>Bleue</span>
                            <input type="number" id="bulk-bleu" step="0.25" min="0" placeholder="ex: 1" onchange="applyBulkLevelPts('bleu', this.value)">
                        </div>
                        <div class="color-box vert">
                            <span>Verte</span>
                            <input type="number" id="bulk-vert" step="0.25" min="0" placeholder="ex: 2" onchange="applyBulkLevelPts('vert', this.value)">
                        </div>
                        <div class="color-box rouge">
                            <span>Rouge</span>
                            <input type="number" id="bulk-rouge" step="0.25" min="0" placeholder="ex: 3" onchange="applyBulkLevelPts('rouge', this.value)">
                        </div>
                    </div>

                    <label>2. Ajustement fin voie par voie :</label>
                    <div id="bareme-ways-list">
                        <!-- Généré dynamiquement -->
                    </div>
                </div>
            </div>

            <!-- GESTION DES ÉLÈVES -->
            <div class="card">
                <label>Gestion des élèves de la classe :</label>
                <div style="margin-bottom: 12px;">
                    <textarea id="import-names-input" rows="2" placeholder="Coller une liste de prénoms (un par ligne ou séparés par des virgules)..."></textarea>
                    <button class="btn-secondary" onclick="importStudents()">Importer / Ajouter ces élèves</button>
                </div>
                
                <div class="prof-controls">
                    <button class="btn-action" onclick="exportCSV()">Exporter la classe en CSV</button>
                    <button class="btn-action btn-danger" onclick="resetCurrentClassData()">Réinitialiser les notes de cette classe</button>
                </div>
            </div>

            <!-- TABLEAU RÉCAPITULATIF -->
            <div class="stats-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Élève</th>
                            <th>Voies validées (Détail)</th>
                            <th>Voies (/<span id="th-max-wall">33.5</span>)</th>
                            <th>Engagement (/5)</th>
                            <th>Sécurité (/5)</th>
                            <th>Total / <span id="th-max-total">40</span></th>
                        </tr>
                    </thead>
                    <tbody id="prof-table-body">
                        <!-- Généré dynamiquement -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <script>
        const DEFAULT_CLASS_NAME = "4e3";
        const DEFAULT_STUDENTS = [
            "Agathe", "Badr", "Selena", "Adam", "Ibrahim-Mamadou", "Tarik", 
            "Lilya", "Sofia", "Cassandra", "Azilize", "Enzo", "Dave", 
            "Gabriel", "Marwa", "Divine", "Zola", "Victoria", "Raphaël", 
            "Fatma", "Anas", "Robin", "Neyl", "Abisha", "Ewan", 
            "Firdaws", "Fatoumata", "Noeud"
        ];

        const DEFAULT_WALL_CONFIG = [
            { id: "A", name: "Voie A", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "bleu", name: "Bleue", pts: 1 }, { id: "vert", name: "Verte", pts: 2 }, { id: "rouge", name: "Rouge", pts: 3 }] },
            { id: "B", name: "Voie B", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "bleu", name: "Bleue", pts: 1 }] },
            { id: "C", name: "Voie C", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "bleu", name: "Bleue", pts: 1 }, { id: "vert", name: "Verte", pts: 2 }, { id: "rouge", name: "Rouge", pts: 3 }] },
            { id: "D", name: "Voie D", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "vert", name: "Verte", pts: 2 }] },
            { id: "E", name: "Voie E", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "bleu", name: "Bleue", pts: 1 }, { id: "vert", name: "Verte", pts: 2 }, { id: "rouge", name: "Rouge", pts: 3 }] },
            { id: "F", name: "Voie F", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "bleu", name: "Bleue", pts: 1 }, { id: "vert", name: "Verte", pts: 2 }] },
            { id: "H", name: "Voie H", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "bleu", name: "Bleue", pts: 1 }, { id: "vert", name: "Verte", pts: 2 }, { id: "rouge", name: "Rouge", pts: 3 }] }
        ];

        let db = {
            activeClass: DEFAULT_CLASS_NAME,
            classes: {},
            baremes: {} // Stocke la config du mur et le plafond par classe
        };

        function cloneDefaultWall() {
            return JSON.parse(JSON.stringify(DEFAULT_WALL_CONFIG));
        }

        function ensureClassBareme(className) {
            if (!db.baremes) db.baremes = {};
            if (!db.baremes[className]) {
                db.baremes[className] = {
                    maxTotal: 40,
                    wall: cloneDefaultWall()
                };
            }
        }

        function getActiveBareme() {
            ensureClassBareme(db.activeClass);
            return db.baremes[db.activeClass];
        }

        function init() {
            const savedDB = localStorage.getItem('escalade_multiclass_db');
            if (savedDB) {
                db = JSON.parse(savedDB);
                if (!db.baremes) db.baremes = {};
            } else {
                db.classes[DEFAULT_CLASS_NAME] = {};
                DEFAULT_STUDENTS.forEach(name => {
                    db.classes[DEFAULT_CLASS_NAME][name] = { climbs: {}, engagement: 3, securite: 3 };
                });
                ensureClassBareme(DEFAULT_CLASS_NAME);
                saveDB();
            }

            if (!db.classes[db.activeClass]) {
                db.activeClass = Object.keys(db.classes)[0] || DEFAULT_CLASS_NAME;
            }
            ensureClassBareme(db.activeClass);

            populateClassSelect();
            populateStudentSelect();
            renderClimbGrid();
            renderBaremeEditor();
            renderProfTable();
            updateHeaderTitle();
        }

        function saveDB() {
            localStorage.setItem('escalade_multiclass_db', JSON.stringify(db));
        }

        function updateHeaderTitle() {
            document.getElementById('app-title').textContent = `Escalade EPS - ${db.activeClass}`;
            document.getElementById('bareme-class-label').textContent = db.activeClass;
        }

        function populateClassSelect() {
            const select = document.getElementById('class-select');
            select.innerHTML = '';
            Object.keys(db.classes).sort().forEach(className => {
                const opt = document.createElement('option');
                opt.value = className;
                opt.textContent = className;
                if (className === db.activeClass) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function changeActiveClasse(className) {
            if (!className) return;
            db.activeClass = className;
            ensureClassBareme(className);
            saveDB();
            populateStudentSelect();
            renderClimbGrid();
            renderBaremeEditor();
            renderProfTable();
            updateHeaderTitle();
            document.getElementById('student-workspace').classList.add('hidden');
            document.getElementById('student-select').value = "";
        }

        function createNewClassPrompt() {
            const newName = prompt("Nom de la nouvelle classe (ex: 5e1, 6e4) :");
            if (!newName) return;
            const cleanName = newName.trim();
            if (db.classes[cleanName]) {
                alert("Cette classe existe déjà.");
                return;
            }
            db.classes[cleanName] = {};
            ensureClassBareme(cleanName);
            db.activeClass = cleanName;
            saveDB();
            populateClassSelect();
            populateStudentSelect();
            renderClimbGrid();
            renderBaremeEditor();
            renderProfTable();
            updateHeaderTitle();
            document.getElementById('student-workspace').classList.add('hidden');
            document.getElementById('student-select').value = "";
        }

        /* --- GESTION DU BARÈME PAR CLASSE --- */
        function toggleBaremePanel() {
            const panel = document.getElementById('bareme-panel');
            panel.classList.toggle('hidden');
        }

        function renderBaremeEditor() {
            const bareme = getActiveBareme();
            document.getElementById('max-total-input').value = bareme.maxTotal;

            // Calcul du max théorique du mur
            let maxWall = 0;
            bareme.wall.forEach(way => {
                way.levels.forEach(lvl => { maxWall += parseFloat(lvl.pts) || 0; });
            });
            const formattedMaxWall = Number.isInteger(maxWall) ? maxWall : maxWall.toFixed(1);
            document.getElementById('wall-max-pts').textContent = formattedMaxWall;
            document.getElementById('th-max-wall').textContent = formattedMaxWall;
            document.getElementById('th-max-total').textContent = bareme.maxTotal;

            // Pré-remplir les champs globaux par couleur si toutes les voies ont la même valeur pour cette couleur
            ['tp', 'bleu', 'vert', 'rouge'].forEach(lvlId => {
                const vals = [];
                bareme.wall.forEach(w => {
                    const found = w.levels.find(l => l.id === lvlId);
                    if (found) vals.push(found.pts);
                });
                const unique = [...new Set(vals)];
                const bulkInput = document.getElementById(`bulk-${lvlId}`);
                bulkInput.value = unique.length === 1 ? unique[0] : '';
            });

            // Rendu voie par voie
            const container = document.getElementById('bareme-ways-list');
            container.innerHTML = '';

            bareme.wall.forEach((way, wIdx) => {
                const row = document.createElement('div');
                row.className = 'bareme-way-row';

                const inputsHtml = way.levels.map((lvl, lIdx) => `
                    <div class="mini-lvl-badge ${lvl.id}">
                        <span>${lvl.name}</span>
                        <input type="number" step="0.25" min="0" value="${lvl.pts}" 
                               onchange="updateSingleLevelPts(${wIdx}, ${lIdx}, this.value)">
                    </div>
                `).join('');

                row.innerHTML = `
                    <strong style="min-width: 70px;">${way.name}</strong>
                    <div class="bareme-inputs-group">${inputsHtml}</div>
                `;
                container.appendChild(row);
            });
        }

        function updateClassSettings() {
            const bareme = getActiveBareme();
            const val = parseFloat(document.getElementById('max-total-input').value);
            if (!isNaN(val) && val > 0) {
                bareme.maxTotal = val;
                saveDB();
                renderBaremeEditor();
                renderProfTable();
            }
        }

        function applyBulkLevelPts(levelId, rawValue) {
            const val = parseFloat(rawValue);
            if (isNaN(val) || val < 0) return;
            const bareme = getActiveBareme();
            bareme.wall.forEach(way => {
                way.levels.forEach(lvl => {
                    if (lvl.id === levelId) {
                        lvl.pts = val;
                    }
                });
            });
            saveDB();
            refreshAllViewsAfterBaremeChange();
        }

        function updateSingleLevelPts(wayIndex, levelIndex, rawValue) {
            const val = parseFloat(rawValue);
            if (isNaN(val) || val < 0) return;
            const bareme = getActiveBareme();
            bareme.wall[wayIndex].levels[levelIndex].pts = val;
            saveDB();
            refreshAllViewsAfterBaremeChange();
        }

        function resetBaremeToDefault() {
            if (confirm(`Remettre le barème standard pour la classe ${db.activeClass} ?`)) {
                db.baremes[db.activeClass] = {
                    maxTotal: 40,
                    wall: cloneDefaultWall()
                };
                saveDB();
                refreshAllViewsAfterBaremeChange();
            }
        }

        function refreshAllViewsAfterBaremeChange() {
            renderBaremeEditor();
            renderClimbGrid();
            renderProfTable();
            const currentStudent = document.getElementById('student-select').value;
            if (currentStudent) updateStudentUI(currentStudent);
        }

        /* --- GESTION ÉLÈVES & TABLEAU --- */
        function importStudents() {
            const text = document.getElementById('import-names-input').value.trim();
            if (!text) {
                alert("Veuillez coller une liste de prénoms.");
                return;
            }

            const names = text.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
            let addedCount = 0;

            names.forEach(name => {
                if (!db.classes[db.activeClass][name]) {
                    db.classes[db.activeClass][name] = { climbs: {}, engagement: 3, securite: 3 };
                    addedCount++;
                }
            });

            saveDB();
            populateStudentSelect();
            renderProfTable();
            document.getElementById('import-names-input').value = "";
            alert(`${addedCount} élève(s) ajouté(s) à la classe ${db.activeClass} !`);
        }

        function setMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            if (mode === 'eleve') {
                document.querySelectorAll('.mode-btn')[0].classList.add('active');
                document.getElementById('section-eleve').classList.remove('hidden');
                document.getElementById('section-prof').classList.add('hidden');
                renderClimbGrid();
                const currentStudent = document.getElementById('student-select').value;
                if (currentStudent) updateStudentUI(currentStudent);
            } else {
                document.querySelectorAll('.mode-btn')[1].classList.add('active');
                document.getElementById('section-prof').classList.remove('hidden');
                document.getElementById('section-eleve').classList.add('hidden');
                renderBaremeEditor();
                renderProfTable();
            }
        }

        function populateStudentSelect() {
            const select = document.getElementById('student-select');
            select.innerHTML = '<option value="">-- Choisis ton nom --</option>';
            const studentsObj = db.classes[db.activeClass] || {};
            Object.keys(studentsObj).sort().forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                select.appendChild(opt);
            });
        }

        function renderClimbGrid() {
            const grid = document.getElementById('climb-grid');
            grid.innerHTML = '';
            const bareme = getActiveBareme();

            bareme.wall.forEach(way => {
                const card = document.createElement('div');
                card.className = 'way-card';
                
                let btnsHTML = way.levels.map(lvl => `
                    <button class="climb-btn ${lvl.id}" id="btn-${way.id}-${lvl.id}" onclick="toggleClimb('${way.id}', '${lvl.id}')">
                        <span>${lvl.name}</span>
                        <span class="pts-tag">(${lvl.pts} pt${lvl.pts > 1 ? 's' : ''})</span>
                    </button>
                `).join('');

                card.innerHTML = `
                    <div class="way-title">${way.name}</div>
                    <div class="buttons-group">${btnsHTML}</div>
                `;
                grid.appendChild(card);
            });
        }

        function loadStudentData() {
            const studentName = document.getElementById('student-select').value;
            const workspace = document.getElementById('student-workspace');

            if (!studentName) {
                workspace.classList.add('hidden');
                return;
            }

            workspace.classList.remove('hidden');
            document.getElementById('display-student-name').textContent = studentName;
            updateStudentUI(studentName);
        }

        function toggleClimb(wayId, levelId) {
            const studentName = document.getElementById('student-select').value;
            if (!studentName) return;

            const classData = db.classes[db.activeClass];
            if (!classData[studentName].climbs) {
                classData[studentName].climbs = {};
            }

            const key = `v${wayId}_${levelId}`;
            if (classData[studentName].climbs[key]) {
                delete classData[studentName].climbs[key];
            } else {
                classData[studentName].climbs[key] = true;
            }

            saveDB();
            updateStudentUI(studentName);
        }

        function calculateClimbPoints(climbsData) {
            let pts = 0;
            if (!climbsData) return 0;
            const bareme = getActiveBareme();

            bareme.wall.forEach(way => {
                way.levels.forEach(lvl => {
                    const key = `v${way.id}_${lvl.id}`;
                    if (climbsData[key]) {
                        pts += parseFloat(lvl.pts) || 0;
                    }
                });
            });
            return Math.round(pts * 100) / 100;
        }

        function updateStudentUI(studentName) {
            const studentData = db.classes[db.activeClass][studentName];
            const climbs = studentData.climbs || {};
            const bareme = getActiveBareme();
            let count = 0;

            bareme.wall.forEach(way => {
                way.levels.forEach(lvl => {
                    const key = `v${way.id}_${lvl.id}`;
                    const btn = document.getElementById(`btn-${way.id}-${lvl.id}`);
                    if (btn) {
                        if (climbs[key]) {
                            btn.classList.add('done');
                            count++;
                        } else {
                            btn.classList.remove('done');
                        }
                    }
                });
            });

            const totalPts = calculateClimbPoints(climbs);
            document.getElementById('display-climb-count').textContent = `${count} voie(s) validée(s)`;
            document.getElementById('display-student-pts').textContent = `${totalPts} pts`;
        }

        function updateExtraScore(studentName, field, value) {
            const classData = db.classes[db.activeClass];
            if (!classData[studentName]) return;
            classData[studentName][field] = parseFloat(value) || 0;
            saveDB();
        }

        function renderProfTable() {
            const tbody = document.getElementById('prof-table-body');
            tbody.innerHTML = '';

            const studentsObj = db.classes[db.activeClass] || {};
            const bareme = getActiveBareme();

            Object.keys(studentsObj).sort().forEach(name => {
                const student = studentsObj[name];
                const climbs = student.climbs || {};
                const climbPts = calculateClimbPoints(climbs);
                
                let detailsText = [];
                bareme.wall.forEach(way => {
                    way.levels.forEach(lvl => {
                        if (climbs[`v${way.id}_${lvl.id}`]) {
                            detailsText.push(`${way.name} (${lvl.name})`);
                        }
                    });
                });
                const detailsDisplay = detailsText.length > 0 ? detailsText.join(', ') : '<span style="color:#64748b">Aucune voie</span>';

                const engagement = student.engagement !== undefined ? student.engagement : 3;
                const securite = student.securite !== undefined ? student.securite : 3;
                const totalNote = Math.min(bareme.maxTotal, climbPts + engagement + securite).toFixed(1);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${name}</strong></td>
                    <td><div class="details-list">${detailsDisplay}</div></td>
                    <td><span class="score-badge">${climbPts}</span></td>
                    <td><input type="number" class="input-score" value="${engagement}" min="0" max="5" step="0.5" onchange="updateExtraScore('${name}', 'engagement', this.value); renderProfTable();"></td>
                    <td><input type="number" class="input-score" value="${securite}" min="0" max="5" step="0.5" onchange="updateExtraScore('${name}', 'securite', this.value); renderProfTable();"></td>
                    <td><span class="note-badge">${totalNote} / ${bareme.maxTotal}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportCSV() {
            const className = db.activeClass;
            const bareme = getActiveBareme();
            let csv = `Classe;Eleve;Detail Voies;Points Voies;Engagement;Securite;Total sur ${bareme.maxTotal}\n`;
            const studentsObj = db.classes[className] || {};

            Object.keys(studentsObj).sort().forEach(name => {
                const student = studentsObj[name];
                const climbs = student.climbs || {};
                const climbPts = calculateClimbPoints(climbs);
                
                let detailsText = [];
                bareme.wall.forEach(way => {
                    way.levels.forEach(lvl => {
                        if (climbs[`v${way.id}_${lvl.id}`]) {
                            detailsText.push(`${way.name}-${lvl.name}`);
                        }
                    });
                });

                const engagement = student.engagement !== undefined ? student.engagement : 3;
                const securite = student.securite !== undefined ? student.securite : 3;
                const totalNote = Math.min(bareme.maxTotal, climbPts + engagement + securite).toFixed(1);

                csv += `"${className}";"${name}";"${detailsText.join(' / ')}";${climbPts};${engagement};${securite};${totalNote}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `evaluation_escalade_${className}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function resetCurrentClassData() {
            if (confirm(`Veux-tu vraiment réinitialiser toutes les notes de la classe ${db.activeClass} ?`)) {
                const studentsObj = db.classes[db.activeClass];
                Object.keys(studentsObj).forEach(name => {
                    studentsObj[name] = { climbs: {}, engagement: 3, securite: 3 };
                });
                saveDB();
                init();
                alert("Données de la classe réinitialisées.");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
