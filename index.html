<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Évaluation Escalade EPS</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            
            --tp-bg: #475569;
            --tp-text: #ffffff;
            --bleu-bg: #2563eb;
            --bleu-text: #ffffff;
            --vert-bg: #16a34a;
            --vert-text: #ffffff;
            --rouge-bg: #dc2626;
            --rouge-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 30px;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .mode-toggle {
            display: flex;
            background: var(--bg);
            border-radius: 8px;
            padding: 2px;
            border: 1px solid var(--border);
        }

        .mode-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .mode-btn.active {
            background: var(--accent);
            color: #0f172a;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            margin-bottom: 10px;
        }

        select:focus, input:focus, textarea:focus {
            border-color: var(--accent);
        }

        .climb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .way-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .way-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .buttons-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .climb-btn {
            border: none;
            padding: 14px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            position: relative;
            transition: transform 0.1s, opacity 0.2s;
        }

        .climb-btn:active {
            transform: scale(0.96);
        }

        .climb-btn.tp { background-color: var(--tp-bg); color: var(--tp-text); }
        .climb-btn.bleu { background-color: var(--bleu-bg); color: var(--bleu-text); }
        .climb-btn.vert { background-color: var(--vert-bg); color: var(--vert-text); }
        .climb-btn.rouge { background-color: var(--rouge-bg); color: var(--rouge-text); }

        .climb-btn.done {
            opacity: 0.4;
            box-shadow: inset 0 0 0 2px var(--text);
        }

        .climb-btn.done::after {
            content: "✓ VALIDÉE";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.9);
            color: #4ade80;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .pts-tag {
            font-size: 0.75rem;
            opacity: 0.9;
            font-weight: normal;
        }

        .summary-banner {
            background: #1e3a8a;
            border: 1px solid #3b82f6;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prof-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .stats-table-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        th {
            background-color: var(--bg);
            color: var(--text-muted);
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .score-badge {
            background: var(--accent);
            color: #0f172a;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: 700;
        }

        .note-badge {
            background: #22c55e;
            color: #0f172a;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .input-score {
            width: 65px;
            padding: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 0;
        }

        .details-list {
            font-size: 0.75rem;
            color: var(--text-muted);
            max-width: 220px;
        }

        .btn-action {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-secondary {
            background: #475569;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .cards-group {
            display: flex;
            gap: 4px;
            align-items: center;
            margin-bottom: 4px;
        }

        .card-btn {
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .card-btn.yellow { background-color: #facc15; color: #713f12; }
        .card-btn.red { background-color: #ef4444; color: #ffffff; }

        .sanction-status {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        .status-yellow-1 { background: rgba(250, 204, 21, 0.2); color: #facc15; border: 1px solid #facc15; }
        .status-yellow-2 { background: rgba(234, 179, 8, 0.3); color: #fde047; border: 1px solid #eab308; }
        .status-red-1 { background: rgba(239, 68, 68, 0.25); color: #f87171; border: 1px solid #ef4444; }
        .status-red-2 { background: rgba(185, 28, 28, 0.4); color: #fca5a5; border: 1px solid #b91c1c; }

        .student-row-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .btn-icon-danger {
            background: transparent;
            color: #ef4444;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            padding: 2px 6px;
        }

        .bareme-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .quick-color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin: 12px 0 18px 0;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .color-box {
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .color-box.tp { background: rgba(71, 85, 105, 0.4); border: 1px solid var(--tp-bg); }
        .color-box.bleu { background: rgba(37, 99, 235, 0.25); border: 1px solid var(--bleu-bg); }
        .color-box.vert { background: rgba(22, 163, 74, 0.25); border: 1px solid var(--vert-bg); }
        .color-box.rouge { background: rgba(220, 38, 38, 0.25); border: 1px solid var(--rouge-bg); }

        .color-box input {
            margin-bottom: 0;
            padding: 6px;
            text-align: center;
            font-weight: bold;
        }

        .bareme-way-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .bareme-way-row:last-child { border-bottom: none; }

        .bareme-inputs-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mini-lvl-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .mini-lvl-badge.tp { background: var(--tp-bg); }
        .mini-lvl-badge.bleu { background: var(--bleu-bg); }
        .mini-lvl-badge.vert { background: var(--vert-bg); }
        .mini-lvl-badge.rouge { background: var(--rouge-bg); }

        .mini-lvl-badge input {
            width: 55px;
            padding: 4px;
            margin-bottom: 0;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1 id="app-title">Escalade EPS</h1>
        <div class="mode-toggle">
            <button class="mode-btn active" onclick="setMode('eleve')">Mode Élève</button>
            <button class="mode-btn" onclick="setMode('prof')">Mode Professeur</button>
        </div>
    </header>

    <div class="container">
        
        <!-- SÉLECTEUR DE CLASSE GLOBAL -->
        <div class="card">
            <label for="class-select">Classe active :</label>
            <div style="display: flex; gap: 10px;">
                <select id="class-select" onchange="changeActiveClasse(this.value)" style="margin-bottom:0; flex:1;"></select>
                <button class="btn-secondary" onclick="createNewClassPrompt()">+ Nouvelle classe</button>
            </div>
        </div>

        <!-- SECTION ÉLÈVE -->
        <section id="section-eleve">
            <div class="card">
                <label for="student-select">Sélectionne ton nom et prénom :</label>
                <select id="student-select" onchange="loadStudentData()">
                    <option value="">-- Choisis ton nom --</option>
                </select>
            </div>

            <div id="student-workspace" class="hidden">
                <div class="summary-banner">
                    <div>
                        <strong id="display-student-name">Élève</strong>
                        <div style="font-size: 0.85rem; color: #93c5fd;" id="display-climb-count">0 voie(s) validée(s)</div>
                    </div>
                    <div style="text-align: right;">
                        <span id="display-student-pts" class="score-badge">0 pts</span>
                    </div>
                </div>

                <div class="climb-grid" id="climb-grid"></div>
            </div>
        </section>

        <!-- SECTION PROFESSEUR -->
        <section id="section-prof" class="hidden">
            
            <!-- GESTION DE LA CLASSE -->
            <div class="card">
                <label>Gestion de la classe active :</label>
                <div style="display: flex; gap: 10px; margin-bottom: 12px; align-items: center;">
                    <input type="text" id="rename-class-input" style="margin-bottom:0; flex:1;" placeholder="Nom de la classe">
                    <button class="btn-action" onclick="renameCurrentClass()">Renommer</button>
                </div>

                <div class="prof-controls">
                    <button class="btn-action" onclick="exportCSV()">Exporter la classe (CSV)</button>
                    <button class="btn-secondary" onclick="archiveNewYearReset()">🔄 Nouvelle année (Vider notes)</button>
                    <button class="btn-action btn-danger" onclick="deleteCurrentClass()">Supprimer cette classe</button>
                </div>
            </div>

            <!-- PARAMÉTRAGE DU BARÈME -->
            <div class="card">
                <div class="bareme-header" onclick="toggleBaremePanel()">
                    <div>
                        <strong style="color: var(--accent); font-size: 1rem;">⚙️ Barème personnalisé (<span id="bareme-class-label">4e3</span>)</strong>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Ajuster les points par couleur ou par voie</div>
                    </div>
                    <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;">Afficher / Modifier</button>
                </div>

                <div id="bareme-panel" class="hidden" style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px;">
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <label style="margin:0;">Plafond total (/):</label>
                            <input type="number" id="max-total-input" class="input-score" style="width: 70px;" value="40" min="10" max="100" step="1" onchange="updateClassSettings()">
                        </div>
                        <div style="font-size: 0.85rem; color: var(--text-muted);">
                            Total max mur : <strong id="wall-max-pts" style="color: var(--accent);">33.5</strong> pts
                        </div>
                        <button class="btn-secondary" style="padding: 6px 10px; font-size: 0.8rem;" onclick="resetBaremeToDefault()">Barème standard</button>
                    </div>

                    <label>Ajustement rapide par couleur :</label>
                    <div class="quick-color-grid">
                        <div class="color-box tp">
                            <span>Toute prise</span>
                            <input type="number" id="bulk-tp" step="0.25" min="0" onchange="applyBulkLevelPts('tp', this.value)">
                        </div>
                        <div class="color-box bleu">
                            <span>Bleue</span>
                            <input type="number" id="bulk-bleu" step="0.25" min="0" onchange="applyBulkLevelPts('bleu', this.value)">
                        </div>
                        <div class="color-box vert">
                            <span>Verte</span>
                            <input type="number" id="bulk-vert" step="0.25" min="0" onchange="applyBulkLevelPts('vert', this.value)">
                        </div>
                        <div class="color-box rouge">
                            <span>Rouge</span>
                            <input type="number" id="bulk-rouge" step="0.25" min="0" onchange="applyBulkLevelPts('rouge', this.value)">
                        </div>
                    </div>

                    <label>Ajustement fin voie par voie :</label>
                    <div id="bareme-ways-list"></div>
                </div>
            </div>

            <!-- GESTION ÉLÈVES & ARRIVÉES / DÉPARTS -->
            <div class="card">
                <label>Gestion des élèves (Arrivées / Départs) :</label>
                <div style="margin-bottom: 12px;">
                    <textarea id="import-names-input" rows="2" placeholder="Ajouter un ou plusieurs prénoms (séparés par des virgules ou retours à la ligne)..."></textarea>
                    <button class="btn-secondary" onclick="importStudents()">+ Ajouter ces élèves</button>
                </div>
                
                <label style="margin-top: 14px;">Liste actuelle (supprimer un élève parti) :</label>
                <div id="students-admin-list" style="max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;"></div>
            </div>

            <!-- TABLEAU RÉCAPITULATIF AVEC CARTONS ET IMPACT AUTOMATIQUE -->
            <div class="stats-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Élève</th>
                            <th>Voies validées</th>
                            <th>Sanctions (Cartons)</th>
                            <th>Voies (/<span id="th-max-wall">33.5</span>)</th>
                            <th>Engagement (/5)</th>
                            <th>Sécurité (/5)</th>
                            <th>Total / <span id="th-max-total">40</span></th>
                        </tr>
                    </thead>
                    <tbody id="prof-table-body"></tbody>
                </table>
            </div>
        </section>

    </div>

    <script>
        const DEFAULT_CLASS_NAME = "4e3";
        const DEFAULT_STUDENTS = [
            "Agathe", "Badr", "Selena", "Adam", "Ibrahim-Mamadou", "Tarik", 
            "Lilya", "Sofia", "Cassandra", "Azilize", "Enzo", "Dave", 
            "Gabriel", "Marwa", "Divine", "Zola", "Victoria", "Raphaël", 
            "Fatma", "Anas", "Robin", "Neyl", "Abisha", "Ewan", 
            "Firdaws", "Fatoumata", "Noeud"
        ];

        const DEFAULT_WALL_CONFIG = [
            { id: "A", name: "Voie A", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "bleu", name: "Bleue", pts: 1 }, { id: "vert", name: "Verte", pts: 2 }, { id: "rouge", name: "Rouge", pts: 3 }] },
            { id: "B", name: "Voie B", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "bleu", name: "Bleue", pts: 1 }] },
            { id: "C", name: "Voie C", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "bleu", name: "Bleue", pts: 1 }, { id: "vert", name: "Verte", pts: 2 }, { id: "rouge", name: "Rouge", pts: 3 }] },
            { id: "D", name: "Voie D", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "vert", name: "Verte", pts: 2 }] },
            { id: "E", name: "Voie E", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "bleu", name: "Bleue", pts: 1 }, { id: "vert", name: "Verte", pts: 2 }, { id: "rouge", name: "Rouge", pts: 3 }] },
            { id: "F", name: "Voie F", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "bleu", name: "Bleue", pts: 1 }, { id: "vert", name: "Verte", pts: 2 }] },
            { id: "H", name: "Voie H", levels: [{ id: "tp", name: "Toute prise", pts: 0.5 }, { id: "bleu", name: "Bleue", pts: 1 }, { id: "vert", name: "Verte", pts: 2 }, { id: "rouge", name: "Rouge", pts: 3 }] }
        ];

        let db = {
            activeClass: DEFAULT_CLASS_NAME,
            classes: {},
            baremes: {}
        };

        function cloneDefaultWall() {
            return JSON.parse(JSON.stringify(DEFAULT_WALL_CONFIG));
        }

        function ensureClassBareme(className) {
            if (!db.baremes) db.baremes = {};
            if (!db.baremes[className]) {
                db.baremes[className] = {
                    maxTotal: 40,
                    wall: cloneDefaultWall()
                };
            }
        }

        function getActiveBareme() {
            ensureClassBareme(db.activeClass);
            return db.baremes[db.activeClass];
        }

        function ensureStudentProps(studentObj) {
            if (!studentObj.climbs) studentObj.climbs = {};
            if (studentObj.baseEngagement === undefined) studentObj.baseEngagement = 3; // Note d'engagement initiale
            if (studentObj.securite === undefined) studentObj.securite = 3;
            if (studentObj.yellowCards === undefined) studentObj.yellowCards = 0;
            if (studentObj.redCards === undefined) studentObj.redCards = 0;
        }

        // Calcule l'engagement effectif en fonction des cartons
        function getComputedEngagement(student) {
            let base = student.baseEngagement !== undefined ? student.baseEngagement : 3;
            let y = student.yellowCards || 0;
            let r = student.redCards || 0;

            let penalty = 0;
            if (y === 1) penalty += 0.5;      // 1er Jaune : -0.5
            if (y === 2) penalty += 1.5;      // 2e Jaune (Avertissement grave) : -1.5 total
            if (r === 1) penalty += 2.0;      // 1er Rouge (Out séance) : -2.0 total
            if (r === 2) {
                return 0;                     // 2e Rouge (Out séquence & permanence) : 0 point direct
            }

            return Math.max(0, base - penalty);
        }

        function init() {
            const savedDB = localStorage.getItem('escalade_multiclass_db');
            if (savedDB) {
                db = JSON.parse(savedDB);
                if (!db.baremes) db.baremes = {};
                Object.keys(db.classes).forEach(cls => {
                    Object.keys(db.classes[cls]).forEach(stu => {
                        ensureStudentProps(db.classes[cls][stu]);
                    });
                });
            } else {
                db.classes[DEFAULT_CLASS_NAME] = {};
                DEFAULT_STUDENTS.forEach(name => {
                    db.classes[DEFAULT_CLASS_NAME][name] = { climbs: {}, baseEngagement: 3, securite: 3, yellowCards: 0, redCards: 0 };
                });
                ensureClassBareme(DEFAULT_CLASS_NAME);
                saveDB();
            }

            if (!db.classes[db.activeClass]) {
                db.activeClass = Object.keys(db.classes)[0] || DEFAULT_CLASS_NAME;
            }
            ensureClassBareme(db.activeClass);

            populateClassSelect();
            populateStudentSelect();
            renderClimbGrid();
            renderBaremeEditor();
            renderStudentsAdminList();
            renderProfTable();
            updateHeaderTitle();
        }

        function saveDB() {
            localStorage.setItem('escalade_multiclass_db', JSON.stringify(db));
        }

        function updateHeaderTitle() {
            document.getElementById('app-title').textContent = `Escalade EPS - ${db.activeClass}`;
            document.getElementById('bareme-class-label').textContent = db.activeClass;
            document.getElementById('rename-class-input').value = db.activeClass;
        }

        function populateClassSelect() {
            const select = document.getElementById('class-select');
            select.innerHTML = '';
            Object.keys(db.classes).sort().forEach(className => {
                const opt = document.createElement('option');
                opt.value = className;
                opt.textContent = className;
                if (className === db.activeClass) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function changeActiveClasse(className) {
            if (!className) return;
            db.activeClass = className;
            ensureClassBareme(className);
            saveDB();
            populateStudentSelect();
            renderClimbGrid();
            renderBaremeEditor();
            renderStudentsAdminList();
            renderProfTable();
            updateHeaderTitle();
            document.getElementById('student-workspace').classList.add('hidden');
            document.getElementById('student-select').value = "";
        }

        function createNewClassPrompt() {
            const newName = prompt("Nom de la nouvelle classe (ex: 5e1, 6e4) :");
            if (!newName) return;
            const cleanName = newName.trim();
            if (db.classes[cleanName]) {
                alert("Cette classe existe déjà.");
                return;
            }
            db.classes[cleanName] = {};
            ensureClassBareme(cleanName);
            db.activeClass = cleanName;
            saveDB();
            populateClassSelect();
            populateStudentSelect();
            renderClimbGrid();
            renderBaremeEditor();
            renderStudentsAdminList();
            renderProfTable();
            updateHeaderTitle();
            document.getElementById('student-workspace').classList.add('hidden');
            document.getElementById('student-select').value = "";
        }

        function renameCurrentClass() {
            const newName = document.getElementById('rename-class-input').value.trim();
            if (!newName) return;
            if (newName === db.activeClass) return;
            if (db.classes[newName]) {
                alert("Une classe porte déjà ce nom.");
                return;
            }

            db.classes[newName] = db.classes[db.activeClass];
            delete db.classes[db.activeClass];

            if (db.baremes[db.activeClass]) {
                db.baremes[newName] = db.baremes[db.activeClass];
                delete db.baremes[db.activeClass];
            }

            db.activeClass = newName;
            saveDB();
            populateClassSelect();
            populateStudentSelect();
            updateHeaderTitle();
            renderProfTable();
            alert(`Classe renommée en "${newName}" avec succès !`);
        }

        function deleteCurrentClass() {
            const current = db.activeClass;
            if (Object.keys(db.classes).length <= 1) {
                alert("Impossible de supprimer la dernière classe restante.");
                return;
            }

            if (confirm(`⚠️ Voulez-vous vraiment supprimer définitivement la classe "${current}" ?`)) {
                delete db.classes[current];
                if (db.baremes[current]) delete db.baremes[current];
                db.activeClass = Object.keys(db.classes)[0];
                saveDB();
                init();
            }
        }

        function archiveNewYearReset() {
            if (confirm(`🔄 Préparation Nouvelle Année : Réinitialiser les notes de la classe ${db.activeClass} ?`)) {
                const studentsObj = db.classes[db.activeClass];
                Object.keys(studentsObj).forEach(name => {
                    studentsObj[name].climbs = {};
                    studentsObj[name].baseEngagement = 3;
                    studentsObj[name].securite = 3;
                    studentsObj[name].yellowCards = 0;
                    studentsObj[name].redCards = 0;
                });
                saveDB();
                renderProfTable();
                const currentStudent = document.getElementById('student-select').value;
                if (currentStudent) updateStudentUI(currentStudent);
                alert("Notes réinitialisées pour la nouvelle année !");
            }
        }

        /* --- GESTION DES SANCTIONS --- */
        function addCard(studentName, type) {
            const student = db.classes[db.activeClass][studentName];
            if (!student) return;

            if (type === 'yellow') {
                if (student.yellowCards < 2) student.yellowCards++;
                else student.yellowCards = 0;
            } else if (type === 'red') {
                if (student.redCards < 2) student.redCards++;
                else student.redCards = 0;
            }
            saveDB();
            renderProfTable();
        }

        function getSanctionStatusHtml(student) {
            const y = student.yellowCards || 0;
            const r = student.redCards || 0;

            if (r === 2) return `<span class="sanction-status status-red-2">🔴 Out Séquence & Perm</span>`;
            if (r === 1) return `<span class="sanction-status status-red-1">🔴 Out Séance</span>`;
            if (y === 2) return `<span class="sanction-status status-yellow-2">⚠️ Avert. Grave (2 Jaunes)</span>`;
            if (y === 1) return `<span class="sanction-status status-yellow-1">🟨 Avertissement simple</span>`;
            return `<span style="color:var(--text-muted); font-size:0.75rem;">RAS</span>`;
        }

        /* --- GESTION ÉLÈVES --- */
        function importStudents() {
            const text = document.getElementById('import-names-input').value.trim();
            if (!text) return;

            const names = text.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
            let addedCount = 0;

            names.forEach(name => {
                if (!db.classes[db.activeClass][name]) {
                    db.classes[db.activeClass][name] = { climbs: {}, baseEngagement: 3, securite: 3, yellowCards: 0, redCards: 0 };
                    addedCount++;
                }
            });

            saveDB();
            populateStudentSelect();
            renderStudentsAdminList();
            renderProfTable();
            document.getElementById('import-names-input').value = "";
            alert(`${addedCount} élève(s) ajouté(s) !`);
        }

        function removeStudent(studentName) {
            if (confirm(`Retirer l'élève ${studentName} de la classe ?`)) {
                delete db.classes[db.activeClass][studentName];
                saveDB();
                populateStudentSelect();
                renderStudentsAdminList();
                renderProfTable();
                document.getElementById('student-workspace').classList.add('hidden');
                document.getElementById('student-select').value = "";
            }
        }

        function renderStudentsAdminList() {
            const container = document.getElementById('students-admin-list');
            container.innerHTML = '';
            const studentsObj = db.classes[db.activeClass] || {};
            const names = Object.keys(studentsObj).sort();

            if (names.length === 0) {
                container.innerHTML = '<div style="font-size:0.8rem; color:var(--text-muted); padding:6px;">Aucun élève.</div>';
                return;
            }

            names.forEach(name => {
                const row = document.createElement('div');
                row.className = 'student-row-admin';
                row.innerHTML = `
                    <span>${name}</span>
                    <button class="btn-icon-danger" onclick="removeStudent('${name}')">✕ Supprimer</button>
                `;
                container.appendChild(row);
            });
        }

        /* --- BARÉMES --- */
        function toggleBaremePanel() {
            document.getElementById('bareme-panel').classList.toggle('hidden');
        }

        function renderBaremeEditor() {
            const bareme = getActiveBareme();
            document.getElementById('max-total-input').value = bareme.maxTotal;

            let maxWall = 0;
            bareme.wall.forEach(way => {
                way.levels.forEach(lvl => { maxWall += parseFloat(lvl.pts) || 0; });
            });
            const formattedMaxWall = Number.isInteger(maxWall) ? maxWall : maxWall.toFixed(1);
            document.getElementById('wall-max-pts').textContent = formattedMaxWall;
            document.getElementById('th-max-wall').textContent = formattedMaxWall;
            document.getElementById('th-max-total').textContent = bareme.maxTotal;

            ['tp', 'bleu', 'vert', 'rouge'].forEach(lvlId => {
                const vals = [];
                bareme.wall.forEach(w => {
                    const found = w.levels.find(l => l.id === lvlId);
                    if (found) vals.push(found.pts);
                });
                const unique = [...new Set(vals)];
                document.getElementById(`bulk-${lvlId}`).value = unique.length === 1 ? unique[0] : '';
            });

            const container = document.getElementById('bareme-ways-list');
            container.innerHTML = '';

            bareme.wall.forEach((way, wIdx) => {
                const row = document.createElement('div');
                row.className = 'bareme-way-row';

                const inputsHtml = way.levels.map((lvl, lIdx) => `
                    <div class="mini-lvl-badge ${lvl.id}">
                        <span>${lvl.name}</span>
                        <input type="number" step="0.25" min="0" value="${lvl.pts}" 
                               onchange="updateSingleLevelPts(${wIdx}, ${lIdx}, this.value)">
                    </div>
                `).join('');

                row.innerHTML = `
                    <strong style="min-width: 70px;">${way.name}</strong>
                    <div class="bareme-inputs-group">${inputsHtml}</div>
                `;
                container.appendChild(row);
            });
        }

        function updateClassSettings() {
            const bareme = getActiveBareme();
            const val = parseFloat(document.getElementById('max-total-input').value);
            if (!isNaN(val) && val > 0) {
                bareme.maxTotal = val;
                saveDB();
                renderBaremeEditor();
                renderProfTable();
            }
        }

        function applyBulkLevelPts(levelId, rawValue) {
            const val = parseFloat(rawValue);
            if (isNaN(val) || val < 0) return;
            const bareme = getActiveBareme();
            bareme.wall.forEach(way => {
                way.levels.forEach(lvl => {
                    if (lvl.id === levelId) lvl.pts = val;
                });
            });
            saveDB();
            refreshAllViewsAfterBaremeChange();
        }

        function updateSingleLevelPts(wayIndex, levelIndex, rawValue) {
            const val = parseFloat(rawValue);
            if (isNaN(val) || val < 0) return;
            const bareme = getActiveBareme();
            bareme.wall[wayIndex].levels[levelIndex].pts = val;
            saveDB();
            refreshAllViewsAfterBaremeChange();
        }

        function resetBaremeToDefault() {
            if (confirm(`Remettre le barème standard pour la classe ${db.activeClass} ?`)) {
                db.baremes[db.activeClass] = { maxTotal: 40, wall: cloneDefaultWall() };
                saveDB();
                refreshAllViewsAfterBaremeChange();
            }
        }

        function refreshAllViewsAfterBaremeChange() {
            renderBaremeEditor();
            renderClimbGrid();
            renderProfTable();
            const currentStudent = document.getElementById('student-select').value;
            if (currentStudent) updateStudentUI(currentStudent);
        }

        /* --- NAVIGATION --- */
        function setMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            if (mode === 'eleve') {
                document.querySelectorAll('.mode-btn')[0].classList.add('active');
                document.getElementById('section-eleve').classList.remove('hidden');
                document.getElementById('section-prof').classList.add('hidden');
                renderClimbGrid();
                const currentStudent = document.getElementById('student-select').value;
                if (currentStudent) updateStudentUI(currentStudent);
            } else {
                document.querySelectorAll('.mode-btn')[1].classList.add('active');
                document.getElementById('section-prof').classList.remove('hidden');
                document.getElementById('section-eleve').classList.add('hidden');
                renderBaremeEditor();
                renderStudentsAdminList();
                renderProfTable();
            }
        }

        function populateStudentSelect() {
            const select = document.getElementById('student-select');
            select.innerHTML = '<option value="">-- Choisis ton nom --</option>';
            const studentsObj = db.classes[db.activeClass] || {};
            Object.keys(studentsObj).sort().forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                select.appendChild(opt);
            });
        }

        function renderClimbGrid() {
            const grid = document.getElementById('climb-grid');
            grid.innerHTML = '';
            const bareme = getActiveBareme();

            bareme.wall.forEach(way => {
                const card = document.createElement('div');
                card.className = 'way-card';
                
                let btnsHTML = way.levels.map(lvl => `
                    <button class="climb-btn ${lvl.id}" id="btn-${way.id}-${lvl.id}" onclick="toggleClimb('${way.id}', '${lvl.id}')">
                        <span>${lvl.name}</span>
                        <span class="pts-tag">(${lvl.pts} pt${lvl.pts > 1 ? 's' : ''})</span>
                    </button>
                `).join('');

                card.innerHTML = `
                    <div class="way-title">${way.name}</div>
                    <div class="buttons-group">${btnsHTML}</div>
                `;
                grid.appendChild(card);
            });
        }

        function loadStudentData() {
            const studentName = document.getElementById('student-select').value;
            const workspace = document.getElementById('student-workspace');

            if (!studentName) {
                workspace.classList.add('hidden');
                return;
            }

            workspace.classList.remove('hidden');
            document.getElementById('display-student-name').textContent = studentName;
            updateStudentUI(studentName);
        }

        function toggleClimb(wayId, levelId) {
            const studentName = document.getElementById('student-select').value;
            if (!studentName) return;

            const classData = db.classes[db.activeClass];
            ensureStudentProps(classData[studentName]);

            const key = `v${wayId}_${levelId}`;
            if (classData[studentName].climbs[key]) {
                delete classData[studentName].climbs[key];
            } else {
                classData[studentName].climbs[key] = true;
            }

            saveDB();
            updateStudentUI(studentName);
        }

        function calculateClimbPoints(climbsData) {
            let pts = 0;
            if (!climbsData) return 0;
            const bareme = getActiveBareme();

            bareme.wall.forEach(way => {
                way.levels.forEach(lvl => {
                    const key = `v${way.id}_${lvl.id}`;
                    if (climbsData[key]) {
                        pts += parseFloat(lvl.pts) || 0;
                    }
                });
            });
            return Math.round(pts * 100) / 100;
        }

        function updateStudentUI(studentName) {
            const studentData = db.classes[db.activeClass][studentName];
            ensureStudentProps(studentData);
            const climbs = studentData.climbs || {};
            const bareme = getActiveBareme();
            let count = 0;

            bareme.wall.forEach(way => {
                way.levels.forEach(lvl => {
                    const key = `v${way.id}_${lvl.id}`;
                    const btn = document.getElementById(`btn-${way.id}-${lvl.id}`);
                    if (btn) {
                        if (climbs[key]) {
                            btn.classList.add('done');
                            count++;
                        } else {
                            btn.classList.remove('done');
                        }
                    }
                });
            });

            const totalPts = calculateClimbPoints(climbs);
            document.getElementById('display-climb-count').textContent = `${count} voie(s) validée(s)`;
            document.getElementById('display-student-pts').textContent = `${totalPts} pts`;
        }

        function updateBaseEngagement(studentName, value) {
            const classData = db.classes[db.activeClass];
            if (!classData[studentName]) return;
            classData[studentName].baseEngagement = parseFloat(value) || 0;
            saveDB();
            renderProfTable();
        }

        function updateExtraScore(studentName, field, value) {
            const classData = db.classes[db.activeClass];
            if (!classData[studentName]) return;
            classData[studentName][field] = parseFloat(value) || 0;
            saveDB();
        }

        function renderProfTable() {
            const tbody = document.getElementById('prof-table-body');
            tbody.innerHTML = '';

            const studentsObj = db.classes[db.activeClass] || {};
            const bareme = getActiveBareme();

            Object.keys(studentsObj).sort().forEach(name => {
                const student = studentsObj[name];
                ensureStudentProps(student);
                const climbs = student.climbs || {};
                const climbPts = calculateClimbPoints(climbs);
                
                let detailsText = [];
                bareme.wall.forEach(way => {
                    way.levels.forEach(lvl => {
                        if (climbs[`v${way.id}_${lvl.id}`]) {
                            detailsText.push(`${way.name} (${lvl.name})`);
                        }
                    });
                });
                const detailsDisplay = detailsText.length > 0 ? detailsText.join(', ') : '<span style="color:#64748b">Aucune voie</span>';

                const computedEng = getComputedEngagement(student);
                const securite = student.securite;
                const totalNote = Math.min(bareme.maxTotal, climbPts + computedEng + securite).toFixed(1);
                const sanctionHtml = getSanctionStatusHtml(student);

                // Si 2 cartons rouges (out séquence), on affiche clairement un style désactivé ou à 0 sur l'input
                const isOutSequence = (student.redCards === 2);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${name}</strong></td>
                    <td><div class="details-list">${detailsDisplay}</div></td>
                    <td>
                        <div class="cards-group">
                            <button class="card-btn yellow" onclick="addCard('${name}', 'yellow')" title="Gérer carton jaune">🟨 (${student.yellowCards})</button>
                            <button class="card-btn red" onclick="addCard('${name}', 'red')" title="Gérer carton rouge">🟥 (${student.redCards})</button>
                        </div>
                        ${sanctionHtml}
                    </td>
                    <td><span class="score-badge">${climbPts}</span></td>
                    <td>
                        <input type="number" class="input-score" value="${computedEng.toFixed(1)}" min="0" max="5" step="0.5" 
                               onchange="updateBaseEngagement('${name}', this.value)" ${isOutSequence ? 'disabled style="opacity:0.4"' : ''} title="Note d'engagement effective après pénalité">
                    </td>
                    <td><input type="number" class="input-score" value="${securite}" min="0" max="5" step="0.5" onchange="updateExtraScore('${name}', 'securite', this.value); renderProfTable();"></td>
                    <td><span class="note-badge">${totalNote} / ${bareme.maxTotal}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportCSV() {
            const className = db.activeClass;
            const bareme = getActiveBareme();
            let csv = `Classe;Eleve;Detail Voies;Points Voies;Cartons Jaunes;Cartons Rouges;Engagement (Effectif);Securite;Total sur ${bareme.maxTotal}\n`;
            const studentsObj = db.classes[className] || {};

            Object.keys(studentsObj).sort().forEach(name => {
                const student = studentsObj[name];
                ensureStudentProps(student);
                const climbs = student.climbs || {};
                const climbPts = calculateClimbPoints(climbs);
                const computedEng = getComputedEngagement(student);
                
                let detailsText = [];
                bareme.wall.forEach(way => {
                    way.levels.forEach(lvl => {
                        if (climbs[`v${way.id}_${lvl.id}`]) {
                            detailsText.push(`${way.name}-${lvl.name}`);
                        }
                    });
                });

                const totalNote = Math.min(bareme.maxTotal, climbPts + computedEng + student.securite).toFixed(1);

                csv += `"${className}";"${name}";"${detailsText.join(' / ')}";${climbPts};${student.yellowCards};${student.redCards};${computedEng};${student.securite};${totalNote}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `evaluation_escalade_${className}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = init;
    </script>
</body>
</html>
